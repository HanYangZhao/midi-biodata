<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MIDI Biodata Configurator</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2em; background: #f8f9fa; }
    h2, h3 { color: #333; }
    .section { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 2em; margin-bottom: 2em; }
    .section-title { margin-top: 0; }
    .preset-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5em;
    }
    .preset-card {
      background: #f4f7fb;
      border: 1px solid #dde3ea;
      border-radius: 8px;
      padding: 1em 1.5em;
      min-width: 260px;
      flex: 1 1 260px;
      box-shadow: 0 1px 4px #0001;
    }
    label { display: block; margin-top: 1em; color: #222; }
    select, input[type="number"], input[type="text"] { width: 100%; }
    .preset-title { font-weight: bold; margin-bottom: 0.5em; color: #2a4d8f; }
    .preset-fields { margin-bottom: 0.5em; }
    .preset-controls { display: flex; gap: 0.5em; }
    #log { width: 100%; height: 200px; margin-top: 1em; font-family: monospace; background: #f0f0f0; overflow-y: scroll; }
    button { margin-top: 1em; }
    .btn-row { display: flex; gap: 1em; margin-top: 1em; }
    .preset-active { border: 2px solid #2a4d8f; background: #eaf1ff; }
  </style>
</head>
<body>
  <h2>MIDI Biodata Configurator</h2>
  <div id="firmwareVersion" style="margin-bottom:1em;color:#2a4d8f;font-weight:bold;"></div>
  <button id="connectBtn">Connect Serial</button>
  <div class="section">
    <h3 class="section-title">Global Settings</h3>
    <form id="globalForm">
      <label>Threshold: <input type="number" step="0.01" id="threshold" min="1.00" max="3.71" required></label>
      <label>Max LED Brightness: <input type="number" id="maxbrightness" min="0" max="255" required></label>
      <div style="display:flex; gap:1.5em; margin-top:2em; margin-bottom:1em;">
        <div style="flex:1; min-width:220px; border:1px solid #dde3ea; border-radius:6px; padding:1em;">
          <strong>BLE/CC</strong>
          <label>BLE MIDI Enabled: <input type="checkbox" id="bleEnabled"></label>
          <label>CC Messaging Enabled: <input type="checkbox" id="ccEnable"></label>
        </div>
        <div style="flex:1; min-width:220px; border:1px solid #dde3ea; border-radius:6px; padding:1em;">
          <strong>Drone</strong>
          <label>BPM: <input type="number" id="bpm" min="20" max="300" value="120" required></label>
          <label>Bars per Chord: <input type="number" id="barsperchord" min="1" max="16" value="4" required></label>
          <label>Drone Enabled: <input type="checkbox" id="droneEnabled"></label>
          <label>Drone Mode:
            <select id="droneMode">
              <option value="0">Free Drone</option>
              <option value="1">BPM Drone (sync to MIDI clock)</option>
            </select>
          </label>
          <label>Drone Velocity: <input type="number" id="droneVel" min="1" max="127" required></label>
        </div>
        <div style="flex:1; min-width:220px; border:1px solid #dde3ea; border-radius:6px; padding:1em;">
          <strong>Notes</strong>
          <label>Note Min (A0=21): <input type="number" id="noteMin" min="0" max="127" required></label>
          <label>Note Max (C8=108): <input type="number" id="noteMax" min="0" max="127" required></label>
          <label>Velocity Min: <input type="number" id="velocityMin" min="1" max="127" required></label>
          <label>Velocity Max: <input type="number" id="velocityMax" min="1" max="127" required></label>
        </div>
        <div style="flex:1; min-width:220px; border:1px solid #dde3ea; border-radius:6px; padding:1em;">
          <strong>MIDI Channel</strong>
          <div style="margin-top:1em; margin-bottom:0.5em;"><u>Input</u></div>
          <label>Input MIDI  (used to trigger preset): <input type="number" id="inputChannel" min="1" max="16" required></label>
          <div style="margin-top:1em; margin-bottom:0.5em;"><u>Outputs</u></div>
          <label>Drone MIDI Channel: <input type="number" id="droneChannel" min="1" max="16" required></label>
          <label>Notes MIDI Channel: <input type="number" id="channel" min="1" max="16" required></label>
        </div>
      </div>
      <div class="btn-row">
        <button type="button" id="readBtn">Read All</button>
        <button type="submit">Save All</button>
      </div>
    </form>
  </div>
  <div class="section">
    <h3 class="section-title">Presets</h3>
    <div class="preset-list" id="presetList"></div>
  </div>
  <div class="btn-row">
    <button type="button" id="downloadSettingsBtn">Download Settings (JSON)</button>
    <input type="file" id="uploadSettingsInput" accept="application/json" style="display:none;">
    <button type="button" id="uploadSettingsBtn">Upload Settings (JSON)</button>
  </div>
  <h3>Serial Log</h3>
  <textarea id="log" readonly></textarea>
  <script>
    // Scale names for dropdown
    const scaleNames = [
      "Chromatic",
      "Ionian (Major)",
      "Dorian",
      "Phrygian",
      "Lydian",
      "Mixolydian",
      "Aeolian (Minor)",
      "Locrian",
      "Raga Bhairav",
      "Major Pentatonic",
      "Minor Pentatonic"
    ];
    // MIDI note names for dropdown
    const noteNames = [
      "C", "C♯/D♭", "D", "D♯/E♭", "E", "F", "F♯/G♭", "G", "G♯/A♭", "A", "A♯/B♭", "B"
    ];

    // --- Preset UI generation ---
    const presetList = document.getElementById('presetList');
    const NUM_PRESETS = 12;
    let presetData = Array(NUM_PRESETS).fill().map(() => ({
      scale: 0, rootNote: 0, midiCCTrigger: -1, midiPCTrigger: -1, midiNoteTrigger: -1, droneChordQ: 0
    }));
    let activePreset = 0;

    function createPresetCard(idx) {
      const card = document.createElement('div');
      card.className = 'preset-card';
      card.id = `preset-card-${idx}`;
      if (idx === activePreset) card.classList.add('preset-active');
      card.innerHTML = `
        <div class="preset-title">Preset ${idx + 1}</div>
        <div class="preset-fields">
          <label>Scale:
            <select id="preset-scale-${idx}"></select>
          </label>
          <label>Root Note:
            <select id="preset-root-${idx}"></select>
          </label>
          <label>MIDI CC Trigger:
            <input type="number" id="preset-cc-${idx}" min="-1" max="127">
            <span style="font-size:0.9em;color:#666;">(-1 disables)</span>
          </label>
          <label>MIDI PC Trigger:
            <input type="number" id="preset-pc-${idx}" min="-1" max="127">
            <span style="font-size:0.9em;color:#666;">(-1 disables)</span>
          </label>
          <label>MIDI Note Trigger:
            <input type="number" id="preset-note-${idx}" min="-1" max="127" step="1">
            <span style="font-size:0.9em;color:#666;">(-1 disables)</span>
          </label>
          <label>Drone Chord Quality:
            <select id="preset-quality-${idx}">
              <option value="0">Triad</option>
              <option value="1">Seventh</option>
              <option value="2">Seventh Sus 4</option>
              <option value="3">Seventh Sus 2</option>
            </select>
          </label>
        </div>
        <div class="preset-controls">
          <button type="button" id="preset-activate-${idx}">Activate</button>
          <button type="button" id="preset-save-${idx}">Save</button>
        </div>
      `;
      // Populate scale dropdown
      const scaleSel = card.querySelector(`#preset-scale-${idx}`);
      scaleNames.forEach((name, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${i} - ${name}`;
        scaleSel.appendChild(opt);
      });
      // Populate root note dropdown
      const rootSel = card.querySelector(`#preset-root-${idx}`);
      for (let i = 0; i < 128; ++i) {
        const octave = Math.floor(i / 12) - 1;
        const name = noteNames[i % 12] + octave;
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${i} - ${name}`;
        rootSel.appendChild(opt);
      }
      // Set initial values
      scaleSel.value = presetData[idx].scale;
      rootSel.value = presetData[idx].rootNote;
      card.querySelector(`#preset-cc-${idx}`).value = presetData[idx].midiCCTrigger;
      card.querySelector(`#preset-pc-${idx}`).value = presetData[idx].midiPCTrigger;
      card.querySelector(`#preset-note-${idx}`).value = presetData[idx].midiNoteTrigger ?? -1;
      card.querySelector(`#preset-quality-${idx}`).value = presetData[idx].droneChordQ || 0;
      // Activate button
      card.querySelector(`#preset-activate-${idx}`).onclick = () => {
        activePreset = idx;
        sendJson({ cmd: "activate_preset", index: idx });
        updatePresetUI();
      };
      // Save button
      card.querySelector(`#preset-save-${idx}`).onclick = () => {
        presetData[idx].scale = parseInt(scaleSel.value, 10);
        presetData[idx].rootNote = parseInt(rootSel.value, 10);
        presetData[idx].midiCCTrigger = parseInt(card.querySelector(`#preset-cc-${idx}`).value, 10);
        presetData[idx].midiPCTrigger = parseInt(card.querySelector(`#preset-pc-${idx}`).value, 10);
        // Validate midiNoteTrigger: must be -1, <min, or >max
        const noteVal = parseInt(card.querySelector(`#preset-note-${idx}`).value, 10);
        const minNote = parseInt(document.getElementById('noteMin').value, 10);
        const maxNote = parseInt(document.getElementById('noteMax').value, 10);
        // if (noteVal !== -1 && !(noteVal < minNote || noteVal > maxNote)) {
        //   alert(`MIDI Note Trigger must be -1 (disabled), less than min note (${minNote}), or greater than max note (${maxNote}).`);
        //   return;
        // }
        presetData[idx].midiNoteTrigger = noteVal;
        presetData[idx].droneChordQ = parseInt(card.querySelector(`#preset-quality-${idx}`).value, 10);
        // Only send this preset for save
        sendJson({
          cmd: "save_presets",
          presets: [presetData[idx]],
          index: idx
        });
      };
      return card;
    }

    function updatePresetUI() {
      presetList.innerHTML = "";
      for (let i = 0; i < NUM_PRESETS; ++i) {
        const card = createPresetCard(i);
        if (i === activePreset) card.classList.add('preset-active');
        presetList.appendChild(card);
      }
    }

    // --- Serial/Global logic ---
    let port, reader, writer;
    const logArea = document.getElementById('log');
    function log(msg, dir = "") {
      logArea.value += (dir ? `[${dir}] ` : "") + msg + "\n";
      logArea.scrollTop = logArea.scrollHeight;
    }

    async function connectSerial() {
      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        writer = port.writable.getWriter();
        reader = port.readable.getReader();
        log("Serial connected", "INFO");
        // Automatically read all settings after connecting
        await sendJson({ cmd: "read" });
        readSerialLoop();
      } catch (e) {
        log("Serial connection failed: " + e, "ERROR");
      }
    }

    async function readSerialLoop() {
      const decoder = new TextDecoder();
      let buffer = "";
      while (port && reader) {
        try {
          const { value, done } = await reader.read();
          if (done) break;
          if (value) {
            buffer += decoder.decode(value);
            let lines = buffer.split('\n');
            buffer = lines.pop();
            for (const line of lines) {
              log(line.trim(), "RX");
              try {
                const jsonStart = line.indexOf('{');
                const jsonEnd = line.lastIndexOf('}');
                if (jsonStart !== -1 && jsonEnd !== -1 && jsonEnd > jsonStart) {
                  const jsonStr = line.substring(jsonStart, jsonEnd + 1);
                  const obj = JSON.parse(jsonStr);
                  updateForm(obj);
                  // Handle active preset highlight from firmware
                  if (obj.status === "active_preset_set" && typeof obj.index === "number") {
                    activePreset = obj.index;
                    updatePresetUI();
                  }
                }
              } catch {}
            }
          }
        } catch (e) {
          log("Read error: " + e, "ERROR");
          break;
        }
      }
    }

    function updateForm(obj) {
      // Update firmware version display
      if (obj.firmwareVersion !== undefined) {
        document.getElementById('firmwareVersion').textContent =
          "Firmware Version: " + obj.firmwareVersion;
      }
      // Update global settings
      if (typeof obj !== "object") return;
      if (obj.thr !== undefined) document.getElementById('threshold').value = obj.thr;
      if (obj.chn !== undefined) document.getElementById('channel').value = obj.chn;
      if (obj.inputChannel !== undefined) document.getElementById('inputChannel').value = obj.inputChannel;
      if (obj.maxb !== undefined) document.getElementById('maxbrightness').value = obj.maxb;
      if (obj.bpm !== undefined) document.getElementById('bpm').value = obj.bpm;
      if (obj.barperch !== undefined) document.getElementById('barsperchord').value = obj.barperch;
      if (obj.drone !== undefined) document.getElementById('droneEnabled').checked = !!obj.drone;
      if (obj.droneMode !== undefined) document.getElementById('droneMode').value = obj.droneMode;
      if (obj.noteMin !== undefined) document.getElementById('noteMin').value = obj.noteMin;
      if (obj.noteMax !== undefined) document.getElementById('noteMax').value = obj.noteMax;
      if (obj.velocityMin !== undefined) document.getElementById('velocityMin').value = obj.velocityMin;
      if (obj.velocityMax !== undefined) document.getElementById('velocityMax').value = obj.velocityMax;
      if (obj.droneVel !== undefined) document.getElementById('droneVel').value = obj.droneVel;
      if (obj.droneChannel !== undefined) document.getElementById('droneChannel').value = obj.droneChannel;
      if (obj.ccEnable !== undefined) document.getElementById('ccEnable').checked = !!obj.ccEnable;
      if (obj.bleEnabled !== undefined) document.getElementById('bleEnabled').checked = !!obj.bleEnabled;
      if (typeof obj.activePreset === "number") activePreset = obj.activePreset;
      // Update presets if present
      if (obj.presets && Array.isArray(obj.presets)) {
        presetData = obj.presets.map((p, i) => ({
          scale: p.scale ?? 0,
          rootNote: p.rootNote ?? 0,
          midiCCTrigger: p.midiCCTrigger ?? (20 + i),
          midiPCTrigger: p.midiPCTrigger ?? i,
          midiNoteTrigger: p.midiNoteTrigger ?? -1,
          droneChordQ: p.droneChordQ ?? 0
        }));
        updatePresetUI();
      }
    }

    async function sendJson(obj) {
      if (!writer) {
        log("Serial not connected", "ERROR");
        return;
      }
      const json = JSON.stringify(obj) + "\n";
      await writer.write(new TextEncoder().encode(json));
      log(json.trim(), "TX");
    }

    function sendPresets() {
      sendJson({
        cmd: "save_presets",
        presets: presetData
      });
    }

    document.getElementById('connectBtn').onclick = connectSerial;

    document.getElementById('readBtn').onclick = async () => {
      await sendJson({ cmd: "read" });
    };

    document.getElementById('bleEnabled').onchange = async (e) => {
      await sendJson({ cmd: "blemidi", enable: e.target.checked });
    };

    // Collect current values from all preset cards into presetData
    function collectPresetDataFromUI() {
      for (let i = 0; i < NUM_PRESETS; ++i) {
        const scaleSel = document.getElementById(`preset-scale-${i}`);
        const rootSel = document.getElementById(`preset-root-${i}`);
        const ccInput = document.getElementById(`preset-cc-${i}`);
        const pcInput = document.getElementById(`preset-pc-${i}`);
        const qualitySel = document.getElementById(`preset-quality-${i}`);
        if (scaleSel && rootSel && ccInput && pcInput && qualitySel) {
          presetData[i].scale = parseInt(scaleSel.value, 10);
          presetData[i].rootNote = parseInt(rootSel.value, 10);
          presetData[i].midiCCTrigger = parseInt(ccInput.value, 10);
          presetData[i].midiPCTrigger = parseInt(pcInput.value, 10);
          const noteInput = document.getElementById(`preset-note-${i}`);
          presetData[i].midiNoteTrigger = noteInput ? parseInt(noteInput.value, 10) : -1;
          presetData[i].droneChordQ = parseInt(qualitySel.value, 10);
        }
      }
    }

    document.getElementById('globalForm').onsubmit = async (e) => {
      e.preventDefault();
      collectPresetDataFromUI();
      const thr = parseFloat(document.getElementById('threshold').value);
      const chn = parseInt(document.getElementById('channel').value, 10);
      const inputChannel = parseInt(document.getElementById('inputChannel').value, 10);
      const maxb = parseInt(document.getElementById('maxbrightness').value, 10);
      const bpm = parseInt(document.getElementById('bpm').value, 10);
      const barperch = parseInt(document.getElementById('barsperchord').value, 10);
      const drone = document.getElementById('droneEnabled').checked ? 1 : 0;
      const droneMode = parseInt(document.getElementById('droneMode').value, 10);
      const noteMin = parseInt(document.getElementById('noteMin').value, 10);
      const noteMax = parseInt(document.getElementById('noteMax').value, 10);
      const velocityMin = parseInt(document.getElementById('velocityMin').value, 10);
      const velocityMax = parseInt(document.getElementById('velocityMax').value, 10);
      const droneVel = parseInt(document.getElementById('droneVel').value, 10);
      const droneChannel = parseInt(document.getElementById('droneChannel').value, 10);
      const ccEnable = document.getElementById('ccEnable').checked ? 1 : 0;
      const bleEnabled = document.getElementById('bleEnabled').checked ? 1 : 0;
      await sendJson({
        cmd: "save_all",
        thr,
        chn,
        inputChannel,
        maxb,
        bpm,
        barperch,
        drone,
        droneMode,
        noteMin,
        noteMax,
        velocityMin,
        velocityMax,
        droneVel,
        droneChannel,
        ccEnable,
        bleEnabled,
        presets: presetData
      });
    };

    // Download settings as JSON
    document.getElementById('downloadSettingsBtn').onclick = () => {
      // Gather current settings from UI
      collectPresetDataFromUI();
      const settings = {
        thr: parseFloat(document.getElementById('threshold').value),
        chn: parseInt(document.getElementById('channel').value, 10),
        inputChannel: parseInt(document.getElementById('inputChannel').value, 10),
        maxb: parseInt(document.getElementById('maxbrightness').value, 10),
        bpm: parseInt(document.getElementById('bpm').value, 10),
        barperch: parseInt(document.getElementById('barsperchord').value, 10),
        drone: document.getElementById('droneEnabled').checked ? 1 : 0,
        droneMode: parseInt(document.getElementById('droneMode').value, 10),
        noteMin: parseInt(document.getElementById('noteMin').value, 10),
        noteMax: parseInt(document.getElementById('noteMax').value, 10),
        velocityMin: parseInt(document.getElementById('velocityMin').value, 10),
        velocityMax: parseInt(document.getElementById('velocityMax').value, 10),
        droneVel: parseInt(document.getElementById('droneVel').value, 10),
        droneChannel: parseInt(document.getElementById('droneChannel').value, 10),
        ccEnable: document.getElementById('ccEnable').checked ? 1 : 0,
        bleEnabled: document.getElementById('bleEnabled').checked ? 1 : 0,
        presets: presetData
      };
      const blob = new Blob([JSON.stringify(settings, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "midi-biodata-settings.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    // Upload settings from JSON
    document.getElementById('uploadSettingsBtn').onclick = () => {
      document.getElementById('uploadSettingsInput').click();
    };
    document.getElementById('uploadSettingsInput').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      try {
        const obj = JSON.parse(text);
        // Update UI fields and presetData from JSON
        if (obj.thr !== undefined) document.getElementById('threshold').value = obj.thr;
        if (obj.chn !== undefined) document.getElementById('channel').value = obj.chn;
        if (obj.maxb !== undefined) document.getElementById('maxbrightness').value = obj.maxb;
        if (obj.inputChannel !== undefined) document.getElementById('inputChannel').value = obj.inputChannel;
        if (obj.bpm !== undefined) document.getElementById('bpm').value = obj.bpm;
        if (obj.barperch !== undefined) document.getElementById('barsperchord').value = obj.barperch;
        if (obj.drone !== undefined) document.getElementById('droneEnabled').checked = !!obj.drone;
        if (obj.droneMode !== undefined) document.getElementById('droneMode').value = obj.droneMode;
        if (obj.noteMin !== undefined) document.getElementById('noteMin').value = obj.noteMin;
        if (obj.noteMax !== undefined) document.getElementById('noteMax').value = obj.noteMax;
        if (obj.velocityMin !== undefined) document.getElementById('velocityMin').value = obj.velocityMin;
        if (obj.velocityMax !== undefined) document.getElementById('velocityMax').value = obj.velocityMax;
        if (obj.droneVel !== undefined) document.getElementById('droneVel').value = obj.droneVel;
        if (obj.droneChannel !== undefined) document.getElementById('droneChannel').value = obj.droneChannel;
        if (obj.ccEnable !== undefined) document.getElementById('ccEnable').checked = !!obj.ccEnable;
        if (obj.bleEnabled !== undefined) document.getElementById('bleEnabled').checked = !!obj.bleEnabled;
        if (obj.presets && Array.isArray(obj.presets)) {
          presetData = obj.presets.map((p, i) => ({
            scale: p.scale ?? 0,
            rootNote: p.rootNote ?? 0,
            midiCCTrigger: p.midiCCTrigger ?? (20 + i),
            midiPCTrigger: p.midiPCTrigger ?? i,
            midiNoteTrigger: p.midiNoteTrigger ?? -1,
            droneChordQ: p.droneChordQ ?? 0
          }));
        }
        updatePresetUI();
        log("Settings JSON loaded into UI", "INFO");
      } catch (err) {
        log("Invalid JSON: " + err, "ERROR");
      }
      e.target.value = "";
    };

    // Initial UI render
    updatePresetUI();
  </script>
</body>
</html>
